<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Applicant Login</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">


    <style>

        body {
            background: #f5f7fb;
        }

        .auth-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 20px;

        }


        .auth-card {

            width: 100%;

            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 15px 40px
                rgba(16, 24, 40, 0.1);

        }


        .auth-logo {

            text-align: center;

            margin-bottom: 30px;

        }


        .auth-logo .logo-icon {

            margin: auto;

        }


        .auth-logo h1 {

            font-size: 25px;

            margin-top: 15px;

        }


        .auth-logo p {

            color: #667085;

            font-size: 14px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;

        }


        .form-group input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d0d5dd;

            border-radius: 8px;

            outline: none;

            font-family: inherit;

            font-size: 14px;

        }


        .form-group input:focus {

            border-color: #0b3d91;

            box-shadow:
                0 0 0 3px
                rgba(11, 61, 145, 0.08);

        }


        .auth-button {

            width: 100%;

            margin-top: 5px;

        }


        .error-message {

            display: none;

            background: #fff1f0;

            color: #b42318;

            border: 1px solid #fecdca;

            padding: 10px;

            border-radius: 7px;

            font-size: 13px;

            margin-bottom: 15px;

        }


        .auth-footer {

            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #667085;

        }


        .auth-footer a {

            color: #0b3d91;

            font-weight: 700;

        }


        .back-home {

            display: block;

            text-align: center;

            margin-top: 18px;

            font-size: 13px;

            color: #667085;

        }

    </style>

</head>


<body>


<div class="auth-page">


    <div class="auth-card">


        <div class="auth-logo">

            <div class="logo-icon">
                U
            </div>

            <h1>
                Applicant Login
            </h1>

            <p>
                Login to continue your application.
            </p>

        </div>


        <div
            class="error-message"
            id="errorMessage">
        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary auth-button">

                Login

            </button>


        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>


        <a
            href="index.html"
            class="back-home">

            ← Back to Homepage

        </a>


    </div>

</div>


<script>

const loginForm =
    document.getElementById("loginForm");

const errorMessage =
    document.getElementById("errorMessage");


loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email")
            .value.trim();

        const password =
            document.getElementById("password")
            .value;


        const storedApplicant =
            localStorage.getItem("applicant");


        if (!storedApplicant) {

            errorMessage.textContent =
                "No applicant account found. Please create an account first.";

            errorMessage.style.display =
                "block";

            return;

        }


        const applicant =
            JSON.parse(storedApplicant);


        if (
            email === applicant.email &&
            password === applicant.password
        ) {

            localStorage.setItem(
                "loggedIn",
                "true"
            );


            alert(
                "Login successful!"
            );


            /*
                Dashboard will be connected
                in the next stage.
            */

            window.location.href =
                "dashboard.html";

        }

        else {

            errorMessage.textContent =
                "Incorrect email or password.";

            errorMessage.style.display =
                "block";

        }

    }

);

</script>


</body>

</html>
